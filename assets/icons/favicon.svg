<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#042f2c" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0d9488" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Soft Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-opacity="0.25" />

  <!-- Main Medical Cross Container -->
  <g filter="url(#glow)">
    <!-- White Rounded Shield Base -->
    <rect x="116" y="116" width="280" height="280" rx="60" fill="#ffffff" />
    
    <!-- Medical Cross -->
    <!-- Vertical Bar -->
    <rect x="226" y="160" width="60" height="192" rx="16" fill="url(#crossGrad)" />
    <!-- Horizontal Bar -->
    <rect x="160" y="226" width="192" height="60" rx="16" fill="url(#crossGrad)" />
  </g>

  <!-- Heart Pulse Center Accent -->
  <g filter="url(#innerGlow)">
    <circle cx="256" cy="256" r="32" fill="#ffffff" />
    <!-- ECG / Heartbeat Line in center -->
    <path d="M236 256 L246 256 L251 242 L256 270 L263 248 L268 256 L276 256" 
          fill="none" 
          stroke="#0d9488" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Small Location / Beacon Indicator -->
  <circle cx="256" cy="116" r="8" fill="#34d399" />
</svg>
